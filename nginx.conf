# Serves the Angular SPA build. The API base URL is baked into the build at compile time
# (see src/environments/environment.ts) and called directly by the browser, so this config
# never proxies to the backend.

gzip on;
gzip_types text/plain text/css application/javascript application/json;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic container health check target.
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Angular routing: unknown paths fall back to index.html so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
