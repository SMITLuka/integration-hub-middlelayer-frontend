@if (auth.error(); as message) {
  <div class="auth-message" role="alert">
    <h1>Login failed</h1>
    <p>{{ message }}</p>
    <a mat-flat-button color="primary" [href]="ssoUrl">Back to SSO portal</a>
  </div>
} @else if (profile.noAccess()) {
  <div class="auth-message">
    <h1>No access</h1>
    <p>None of your SSO roles grants access to Integration Hub. Please ask an SSO administrator for it.</p>
    <a mat-flat-button color="primary" [href]="ssoUrl">Back to SSO portal</a>
  </div>
} @else {
  <app-shell></app-shell>
}
