<header class="ih-header">
  <div class="header-left">
    <img src="images/smit-logo.png" alt="SM-IT" class="header-logo" />
    <span class="title-main">Integration Hub</span>
  </div>

  <div class="header-right">
    @if (auth.userName(); as name) {
      <span class="user-name">{{ name }}</span>
    }
    <button mat-button class="logout-button" (click)="auth.logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
    <a href="https://sm-it.hr/" target="_blank" rel="noopener" class="smit-link">sm-it.hr</a>
  </div>
</header>
