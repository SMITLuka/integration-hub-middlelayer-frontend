<div class="page">
  <div class="page-header">
    <h1 class="page-title">{{ mode === 'create' ? 'New Mandator' : 'Edit Mandator' }}</h1>
  </div>

  <div class="card">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="field-grid">
        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" placeholder="Autokuća Longin d.o.o." required />
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>System</mat-label>
          <input matInput formControlName="system" placeholder="Pantheon" />
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>Personal Identification Number</mat-label>
          <input matInput formControlName="personalIdentificationNumber" placeholder="12934449907" />
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>Mandator ID</mat-label>
          <input matInput formControlName="externalMandatorId" placeholder="B0" />
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>Host URL</mat-label>
          <input matInput formControlName="hostUrl" placeholder="pantheon.sm-it.hr" />
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>Port</mat-label>
          <input matInput type="number" step="1" formControlName="port" placeholder="1666" />
          <mat-error>Port must be a whole number between 1 and 65535</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>Country</mat-label>
          <input matInput formControlName="country" placeholder="AT" />
        </mat-form-field>

        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>Locale</mat-label>
          <input matInput formControlName="locale" placeholder="de-AT" />
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-button type="button" routerLink="/mandators">Cancel</button>
        <button mat-flat-button color="primary" type="submit">Save</button>
      </div>
    </form>
  </div>

  @if (mode === 'edit') {
    <div class="card">
      <h2 class="card-section-title">Additional Data</h2>
      <app-key-value-editor
        [rows]="additionalData()"
        [allowAdd]="true"
        (add)="onAdditionalDataAdd($event)"
        (delete)="onAdditionalDataDelete($event)"
      ></app-key-value-editor>
    </div>
  }
</div>
