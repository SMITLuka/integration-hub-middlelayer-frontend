<div class="page">
  <div class="page-header">
    <h1 class="page-title">Mandators</h1>
    @if (profile.can('MANDATORS_COMPANIES', 'write')) {
      <button mat-flat-button color="primary" routerLink="/mandators/new">
        <mat-icon>add</mat-icon>
        New
      </button>
    }
  </div>

  <div class="card">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [totalElements]="totalElements()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      searchPlaceholder="Search mandators"
      emptyMessage="No mandators found."
      (searchChange)="onSearchChange($event)"
      (pageIndexChange)="onPageIndexChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      (rowClick)="onRowClick($event)"
    >
      <ng-template let-row>
        <app-action-menu [items]="buildActions(row)"></app-action-menu>
      </ng-template>
    </app-data-table>
  </div>
</div>
