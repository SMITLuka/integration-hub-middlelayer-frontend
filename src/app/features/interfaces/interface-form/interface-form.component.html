<div class="page">
  <div class="page-header">
    <h1 class="page-title">{{ mode === 'create' ? 'New Interface' : 'Edit Interface' }}</h1>
  </div>

  <div class="card">
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="field-grid">
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" required />
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="5" maxlength="2000" placeholder="Describe what this integration does"></textarea>
        <mat-hint align="end">{{ form.controls.description.value.length }} / 2000</mat-hint>
      </mat-form-field>

      <div class="form-actions">
        <button mat-button type="button" routerLink="/interfaces">Cancel</button>
        <button mat-flat-button color="primary" type="submit">Save</button>
      </div>
    </form>
  </div>

  @if (mode === 'edit') {
    <div class="card">
      <h2 class="card-section-title">Additional Data</h2>
      <app-key-value-editor
        [rows]="additionalData()"
        [allowAdd]="true"
        (add)="onAdditionalDataAdd($event)"
        (delete)="onAdditionalDataDelete($event)"
      ></app-key-value-editor>
    </div>
  }
</div>
